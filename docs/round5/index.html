<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>N3 單字卡 第五輪</title>
    <meta name="theme-color" content="#f7f4ee" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="N3 單字卡 第五輪" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.json" />
    <style>
      :root {
        --paper: #f7f4ee;
        --ink: #2f2c28;
        --muted: #746f67;
        --line: #d8d1c5;
        --soft: #ebe6dc;
        --accent: #8a2f25;
        --accent-soft: #eadbd6;
        --white: #fffdf8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--paper);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Sans",
          "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans TC",
          sans-serif;
        letter-spacing: 0;
      }

      main {
        width: min(880px, calc(100% - 32px));
        margin: 0 auto;
        padding: 40px 0 28px;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        padding-bottom: 22px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 5vw, 48px);
        font-weight: 500;
      }

      .subhead {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .count {
        color: var(--muted);
        font-size: 14px;
        white-space: nowrap;
      }

      .study {
        display: grid;
        grid-template-columns: 1fr;
        gap: 18px;
        padding: 32px 0 22px;
      }

      .card-shell {
        position: relative;
        min-height: 340px;
        border: 1px solid var(--line);
        background: var(--white);
        display: grid;
        place-items: center;
        padding: 34px;
      }

      .card {
        width: 100%;
        max-width: 620px;
        text-align: center;
      }

      .copy-tools {
        position: absolute;
        top: 8px;
        right: 8px;
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .copy-status {
        color: var(--muted);
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 120ms ease;
        white-space: nowrap;
      }

      .copy-status.show {
        opacity: 1;
      }

      .copy-btn {
        width: 40px;
        height: 40px;
        min-height: 40px;
        padding: 0;
        display: grid;
        place-items: center;
        font-size: 22px;
        line-height: 1;
      }

      .label {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 18px;
      }

      .front {
        font-size: clamp(48px, 12vw, 96px);
        line-height: 1.1;
        font-weight: 400;
      }

      .kanji {
        font-size: clamp(34px, 8vw, 64px);
        line-height: 1.15;
        font-weight: 500;
        margin-bottom: 14px;
      }

      .word-reading {
        color: var(--muted);
        font-size: 16px;
        margin-bottom: 10px;
      }

      .meaning {
        color: var(--accent);
        font-size: 20px;
        margin-bottom: 22px;
      }

      .example {
        width: min(100%, 560px);
        margin: 0 auto;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        font-size: 20px;
        line-height: 1.7;
      }

      .example-reading {
        width: min(100%, 560px);
        margin: 8px auto 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.7;
      }

      .example-meaning {
        width: min(100%, 560px);
        margin: 8px auto 0;
        color: var(--ink);
        font-size: 16px;
        line-height: 1.7;
      }

      .part-of-speech {
        width: min(100%, 560px);
        margin: 8px auto 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      button {
        min-height: 46px;
        border: 1px solid var(--line);
        background: var(--white);
        color: var(--ink);
        font: inherit;
        cursor: pointer;
      }

      button:hover {
        background: var(--soft);
      }

      button:focus-visible {
        outline: 3px solid var(--accent-soft);
        outline-offset: 2px;
      }

      .primary {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--white);
      }

      .primary:hover {
        background: #1f1d1a;
      }

      .progress-wrap {
        height: 4px;
        background: var(--soft);
      }

      .progress {
        width: 0%;
        height: 100%;
        background: var(--accent);
        transition: width 160ms ease;
      }

      details {
        border-top: 1px solid var(--line);
        padding-top: 18px;
      }

      summary {
        cursor: pointer;
        color: var(--muted);
        margin-bottom: 14px;
      }

      .list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .list li {
        border: 1px solid var(--line);
        background: rgba(255, 253, 248, 0.68);
        padding: 10px 12px;
        font-size: 14px;
      }

      .front-only .back-content,
      .back-only .front-content {
        display: none;
      }

      @media (max-width: 640px) {
        main {
          width: min(100% - 22px, 880px);
          padding-top: 24px;
        }

        header {
          display: block;
        }

        .count {
          margin-top: 12px;
        }

        .card-shell {
          min-height: 330px;
          padding: 24px 18px;
        }

        .controls {
          grid-template-columns: 1fr 1fr;
        }

        #nextBtn {
          order: 2;
        }

        #flipBtn {
          order: 3;
        }

        #shuffleBtn {
          order: 4;
        }

        .example {
          font-size: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>N3 單字卡 第五輪</h1>
          <p class="subhead">第五輪單字卡。正面是平假名，背面是漢字、意思和例句。每輪 57 張，順序隨機。</p>
        </div>
        <div class="count" id="counter">1 / 57</div>
      </header>

      <section class="study" aria-label="單字卡練習">
        <div class="progress-wrap" aria-hidden="true">
          <div class="progress" id="progress"></div>
        </div>

        <div class="card-shell front-only" id="cardShell">
          <div class="copy-tools">
            <span class="copy-status" id="copyStatus">Copy Success</span>
            <button type="button" class="copy-btn" id="copyBtn" aria-label="Copy word" title="Copy word">⧉</button>
          </div>
          <article class="card" aria-live="polite">
            <div class="front-content">
              <div class="label">正面</div>
              <div class="front" id="frontText"></div>
            </div>
            <div class="back-content">
              <div class="label">背面</div>
              <div class="word-reading" id="wordReadingText"></div>
              <div class="kanji" id="kanjiText"></div>
              <div class="meaning" id="meaningText"></div>
              <div class="example" id="exampleText"></div>
              <div class="example-reading" id="exampleReadingText"></div>
              <div class="example-meaning" id="exampleMeaningText"></div>
              <div class="part-of-speech" id="partOfSpeechText"></div>
            </div>
          </article>
        </div>

        <div class="controls">
          <button type="button" id="prevBtn">上一張</button>
          <button type="button" class="primary" id="flipBtn">翻面</button>
          <button type="button" id="nextBtn">下一張</button>
          <button type="button" id="shuffleBtn">重新洗牌</button>
        </div>
      </section>

      <details>
        <summary>查看本輪單字</summary>
        <ul class="list" id="wordList"></ul>
      </details>
    </main>

    <script>
      let cards = [];
      const state = {
        order: [],
        index: 0,
        showingBack: false
      };

      const cardShell = document.getElementById("cardShell");
      const frontText = document.getElementById("frontText");
      const wordReadingText = document.getElementById("wordReadingText");
      const kanjiText = document.getElementById("kanjiText");
      const meaningText = document.getElementById("meaningText");
      const exampleText = document.getElementById("exampleText");
      const exampleReadingText = document.getElementById("exampleReadingText");
      const exampleMeaningText = document.getElementById("exampleMeaningText");
      const partOfSpeechText = document.getElementById("partOfSpeechText");
      const copyBtn = document.getElementById("copyBtn");
      const copyStatus = document.getElementById("copyStatus");
      const counter = document.getElementById("counter");
      const progress = document.getElementById("progress");
      const wordList = document.getElementById("wordList");
      let copyTimer;

      function shuffle(array) {
        const result = [...array];
        for (let i = result.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [result[i], result[j]] = [result[j], result[i]];
        }
        return result;
      }

      function currentCard() {
        return cards[state.order[state.index]];
      }

      function render() {
        const card = currentCard();
        frontText.textContent = card.kana;
        wordReadingText.textContent = `${card.kana} [${card.accent}]`;
        kanjiText.textContent = card.kanji;
        meaningText.textContent = card.meaning;
        exampleText.textContent = card.example;
        exampleReadingText.textContent = card.exampleReading;
        exampleMeaningText.textContent = card.exampleMeaning;
        partOfSpeechText.textContent = `POS：${card.pos}`;
        counter.textContent = `${state.index + 1} / ${cards.length}`;
        progress.style.width = `${((state.index + 1) / cards.length) * 100}%`;
        cardShell.className = `card-shell ${state.showingBack ? "back-only" : "front-only"}`;
        document.getElementById("flipBtn").textContent = state.showingBack ? "看正面" : "翻面";
      }

      function renderWordList() {
        wordList.innerHTML = "";
        state.order.forEach((cardIndex) => {
          const card = cards[cardIndex];
          const item = document.createElement("li");
          item.textContent = `${card.kana} / ${card.kanji}`;
          wordList.appendChild(item);
        });
      }

      function resetDeck() {
        state.order = shuffle(cards.map((_, index) => index));
        state.index = 0;
        state.showingBack = false;
        render();
        renderWordList();
      }

      function move(delta) {
        state.index = (state.index + delta + cards.length) % cards.length;
        state.showingBack = false;
        render();
      }

      async function copyCurrentWord() {
        const card = currentCard();
        const text = `${card.kanji}（${card.kana}）`;
        try {
          await navigator.clipboard.writeText(text);
        } catch {
          const textarea = document.createElement("textarea");
          textarea.value = text;
          textarea.setAttribute("readonly", "");
          textarea.style.position = "fixed";
          textarea.style.opacity = "0";
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand("copy");
          textarea.remove();
        }

        copyStatus.classList.add("show");
        clearTimeout(copyTimer);
        copyTimer = setTimeout(() => {
          copyStatus.classList.remove("show");
        }, 1000);
      }

      document.getElementById("flipBtn").addEventListener("click", () => {
        state.showingBack = !state.showingBack;
        render();
      });

      copyBtn.addEventListener("click", copyCurrentWord);
      document.getElementById("nextBtn").addEventListener("click", () => move(1));
      document.getElementById("prevBtn").addEventListener("click", () => move(-1));
      document.getElementById("shuffleBtn").addEventListener("click", resetDeck);

      document.addEventListener("keydown", (event) => {
        if (event.key === " ") {
          event.preventDefault();
          state.showingBack = !state.showingBack;
          render();
        }
        if (event.key === "ArrowRight") move(1);
        if (event.key === "ArrowLeft") move(-1);
      });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./service-worker.js").then((registration) => {
            registration.update();
          });
        });
      }

      fetch("./cards.json")
        .then((response) => response.json())
        .then((data) => {
          cards = data;
          resetDeck();
        });
    </script>
  </body>
</html>
